name: Auto-generate songs.json

on:
  push:
    branches: [main, master]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate songs.json for each category
        run: python3 generate.py

      - name: Commit updated songs.json files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add aesthetic/songs.json chill/songs.json badass/songs.json \
                  hot/songs.json phonk/songs.json sad/songs.json soft/songs.json
          git diff --staged --quiet || git commit -m "chore: auto-update songs.json"
          git push

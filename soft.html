  <section class="category-hero">
    <div class="category-hero__shapes" aria-hidden="true">
      <div class="category-hero__shape category-hero__shape--1"></div>
      <div class="category-hero__shape category-hero__shape--2"></div>
    </div>
    <h1 class="category-hero__title">Soft</h1>
  </section>

  <main class="song-section" id="songList" aria-label="Song list">
    <!-- Populated by script.js -->
  </main>

  <footer class="footer">
    <span>Created with ♥ by lolipop &amp; k0com | Always credit the original creators</span>
    <a href="#" class="footer__tiktok" aria-label="TikTok">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.69a8.22 8.22 0 004.8 1.54V6.76a4.85 4.85 0 01-1.03-.07z"/>
      </svg>
    </a>
  </footer>

  <div class="audio-player" id="audioPlayer" role="region" aria-label="Audio player">
    <button class="audio-player__btn" id="playerPlayBtn" aria-label="Play / Pause">▶</button>
    <div class="audio-player__info">
      <div class="audio-player__song" id="playerSongName">—</div>
      <div class="audio-player__category" id="playerCategory">—</div>
    </div>
    <div class="audio-player__controls">
      <span class="audio-player__time" id="playerCurrentTime">0:00</span>
      <input type="range" class="audio-player__progress" id="playerProgress"
             min="0" max="100" step="0.1" value="0" aria-label="Seek" />
      <span class="audio-player__time" id="playerTotalTime">0:00</span>
    </div>
    <div class="audio-player__volume">
      <span class="audio-player__volume-icon" aria-hidden="true">🔊</span>
      <input type="range" class="audio-player__vol-range" id="playerVolume"
             min="0" max="1" step="0.01" value="1" aria-label="Volume" />
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
